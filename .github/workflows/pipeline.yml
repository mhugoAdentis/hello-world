
name: Hello World CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-test-publish:

    name: Build, Test and Publish

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t hello-web:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name hello-web \
            -p 8080:80 \
            hello-web:${{ github.sha }}

      - name: Test application
        run: |
          curl --retry 10 \
            --retry-connrefused \
            --retry-delay 2 \
            -fsS http://localhost:8080 | grep "Hello World"

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f hello-web || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag hello-web:${{ github.sha }} \
            mbhugo/hello-web:${{ github.sha }}

          docker tag hello-web:${{ github.sha }} \
            mbhugo/hello-web:latest

      - name: Publish Docker image
        run: |
          docker push mbhugo/hello-web:${{ github.sha }}
          docker push mbhugo/hello-web:latest
